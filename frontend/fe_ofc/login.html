<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Restaurant - Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>
  <div class="phone splash-wrap">
    <div class="splash" style="padding-top: 40px; padding-bottom: 20px;">
      <div class="splash-logo"><i class="ph-duotone ph-storefront"></i></div>
      <h1>Smart Restaurant Ordering</h1>
      <p class="splash-sub">Hệ thống Quản lý Nhà hàng Thông minh</p>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="form-group">
          <label for="username"><i class="ph-bold ph-user"></i> Tên đăng nhập</label>
          <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="password"><i class="ph-bold ph-lock-key"></i> Mật khẩu</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" autocomplete="new-password" required>
            <i class="ph-duotone ph-eye-slash" id="togglePassword" title="Hiện/Ẩn mật khẩu"></i>
          </div>
        </div>
        <p id="error-msg" class="error-msg"></p>
        <button type="submit" class="btn-login" id="btnLogin">
          Đăng nhập
          <i class="ph-bold ph-sign-in"></i>
        </button>
      </form>

      <div class="quick-fill-section">
        <p class="quick-fill-title">Demo Quick-Fill (Điền nhanh)</p>
        <div class="quick-fill-buttons">
          <button type="button" class="qf-btn" onclick="quickFill('customer')">
            <i class="ph-duotone ph-user"></i> Khách
          </button>
          <button type="button" class="qf-btn" onclick="quickFill('kitchen')">
            <i class="ph-duotone ph-chef-hat"></i> Bếp
          </button>
          <button type="button" class="qf-btn" onclick="quickFill('waiter')">
            <i class="ph-duotone ph-bell-ringing"></i> Phục vụ
          </button>
          <button type="button" class="qf-btn" onclick="quickFill('cashier')">
            <i class="ph-duotone ph-wallet"></i> Thu ngân
          </button>
          <button type="button" class="qf-btn" onclick="quickFill('manager')">
            <i class="ph-duotone ph-chart-bar"></i> Quản lý
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/login.js"></script>
</body>

</html>
